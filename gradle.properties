org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.java.home=C:/Users/Admin/.sdkman/candidates/java/21.0.11-amzn

# The released version, and the one place it is written. `make release VERSION=x.y.z` rewrites this
# line through the setVersion task rather than by hand, so the number in the tag, in CHANGELOG.md
# and on the Marketplace can only ever be the same number.
pluginVersion=0.0.3

# IntelliJ Platform
platformVersion=2025.2
platformType=IC
sinceBuild=252

# The platform already bundles the Kotlin stdlib. Letting the Gradle Kotlin plugin add its own
# ships a second copy inside the plugin and risks a version mismatch at runtime.
kotlin.stdlib.default.dependency=false
